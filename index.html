<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qanat</title>
    <meta
      name="description"
      content="A browser game about routing a finite amount of water through a grid of turning channels before the tank runs dry."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Qanat</h1>
      <!-- One destination, so the landmark carries no visible list: a second
           copy of the title in the corner is noise, not navigation. -->
      <nav aria-label="Primary" class="sr-only">
        <a href="./">Qanat</a>
      </nav>
    </header>
    <main>
      <div class="field">
        <div class="gauge tank" id="tank"><i></i></div>

        <div class="stage" id="stage">
          <canvas id="board"></canvas>
          <div class="cells" id="cells"></div>
        </div>

        <div class="gauge grove" id="grove"><i></i></div>
      </div>

      <ol class="progress" id="progress"></ol>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
